<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a1a"><title>Bingo Royale — Offline</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#070a1a;color:#f4f5ff;font-family:system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}main{max-width:360px;text-align:center}img{width:96px;height:96px;border-radius:22px}h1{font-size:28px;color:#d4a24c}p{color:#b8bedb;line-height:1.6}button,a{display:block;width:100%;padding:14px 20px;border-radius:12px;font:600 16px system-ui;text-decoration:none;cursor:pointer}button{border:0;background:#d4a24c;color:#070a1a}a{margin-top:12px;color:#d4a24c;border:1px solid #645033}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head>
<body><main><img src="/icons/icon-192.png" alt="" width="96" height="96"><h1 id="title">You’re offline</h1><p id="message">Bingo Royale needs an internet connection to join rooms and play live games. Reconnect, then try again.</p><button id="retry" type="button">Try again</button><a id="home" href="/">Go to home</a></main>
<script>let lang=navigator.language;try{lang=localStorage.getItem('bingo-lang')||lang}catch{}if(lang.startsWith('es')){document.documentElement.lang='es';document.getElementById('title').textContent='No tienes conexión';document.getElementById('message').textContent='Bingo Royale necesita conexión a internet para entrar a las salas y jugar en vivo. Conéctate e inténtalo de nuevo.';document.getElementById('retry').textContent='Reintentar';document.getElementById('home').textContent='Ir al inicio'}document.getElementById('retry').addEventListener('click',()=>location.reload());</script>
</body></html>
